name: CI

# Mirrors the Jenkins pipeline on GitHub-hosted runners:
#   lint -> unit tests -> SonarQube quality gate -> Trivy fs + image scan -> build -> smoke-test "deploy"
# plus a job that builds the Jenkins image, which proves the pinned tool downloads still work.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: devsecops-demo
  TRIVY_VERSION: "0.76.1"
  SONARQUBE_TAG: "26.10.0.133078-community"

jobs:
  lint:
    name: Lint (ruff, shellcheck, compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff (style + bandit security rules)
        run: ruff check .

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: pytest with coverage
        run: |
          mkdir -p reports
          pytest --junitxml=reports/junit.xml --cov --cov-report=xml:coverage.xml --cov-report=term

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            reports/junit.xml
            coverage.xml

  sonarqube:
    name: SonarQube analysis + quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history gives SonarQube accurate blame / new-code detection

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Produce coverage report
        run: |
          pip install -r requirements-dev.txt
          pytest --cov --cov-report=xml:coverage.xml

      # Throwaway SonarQube Community Build just for this run (embedded DB, nothing persisted).
      - name: Start SonarQube
        run: |
          sudo sysctl -w vm.max_map_count=524288
          docker run -d --name sonarqube -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            "sonarqube:${SONARQUBE_TAG}"

      - name: Wait until SonarQube is UP
        run: |
          for i in $(seq 1 60); do
            status="$(curl -fsS http://localhost:9000/api/system/status 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)"
            echo "[$i/60] status=${status:-unreachable}"
            if [ "$status" = "UP" ]; then exit 0; fi
            sleep 5
          done
          docker logs sonarqube | tail -n 50
          exit 1

      - name: Create analysis token
        run: |
          token="$(curl -fsS -u admin:admin -X POST http://localhost:9000/api/user_tokens/generate \
            -d name=ci -d type=GLOBAL_ANALYSIS_TOKEN \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          echo "::add-mask::${token}"
          echo "SONAR_TOKEN=${token}" >> "$GITHUB_ENV"

      # Runs as the runner's uid so the scanner can write .scannerwork into the workspace.
      - name: Scan and wait for the quality gate
        run: |
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e SONAR_USER_HOME=/tmp/.sonar \
            -e SONAR_HOST_URL=http://localhost:9000 \
            -e SONAR_TOKEN \
            -v "$GITHUB_WORKSPACE:/usr/src" \
            sonarsource/sonar-scanner-cli \
            -Dsonar.qualitygate.wait=true

      - name: SonarQube logs (on failure)
        if: failure()
        run: docker logs sonarqube | tail -n 100

  build-and-scan:
    name: Trivy scans, image build and smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # only used to upload SARIF on public repositories
    steps:
      - uses: actions/checkout@v5

      # Trivy is installed from the official release and verified against its published checksums.
      - name: Install Trivy ${{ env.TRIVY_VERSION }}
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${file}\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          sudo mkdir -p /opt/trivy
          sudo tar -xzf "${file}" -C /opt/trivy
          sudo ln -sf /opt/trivy/trivy /usr/local/bin/trivy
          trivy --version

      - uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Trivy filesystem scan (dependencies, secrets, Dockerfile misconfig)
        run: |
          mkdir -p reports
          trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed \
            --format json --output reports/trivy-fs.json .
          trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 .

      - name: Build image
        run: docker build --pull -t "$IMAGE_NAME:${GITHUB_SHA::7}" -t "$IMAGE_NAME:latest" .

      - name: Trivy image scan
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed \
            --format template --template "@/opt/trivy/contrib/html.tpl" \
            --output reports/trivy-image.html "$IMAGE_NAME:latest"
          trivy image --severity HIGH,CRITICAL --ignore-unfixed \
            --format sarif --output reports/trivy-image.sarif "$IMAGE_NAME:latest"
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE_NAME:latest"

      - name: Smoke test ("deploy" on the runner)
        run: |
          docker run -d --name app -p 5000:5000 "$IMAGE_NAME:latest"
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:5000/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:5000/health
          curl -fsS http://localhost:5000/add/20/22 | grep -q 42

      - name: Container logs (on failure)
        if: failure()
        run: docker logs app || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: reports/

      # Code scanning needs a public repository (or GitHub Advanced Security) and a non-fork run.
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && github.event_name != 'pull_request' && !github.event.repository.private && hashFiles('reports/trivy-image.sarif') != ''
        with:
          sarif_file: reports/trivy-image.sarif
          category: trivy-image

  jenkins-image:
    name: Build Jenkins image (tooling check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -t devsecops-jenkins:ci ./jenkins

      - name: Verify installed tooling
        run: |
          docker run --rm --entrypoint sh devsecops-jenkins:ci -c '
            set -e
            docker --version
            trivy --version | head -n 1
            sonar-scanner --version
            python3 --version
            java -version
            test -f /opt/trivy/contrib/html.tpl
            for p in sonar workflow-aggregator git ansicolor timestamper; do
              test -f "/usr/share/jenkins/ref/plugins/$p.jpi" || test -f "/usr/share/jenkins/ref/plugins/$p.hpi"
              echo "plugin ok: $p"
            done
          '
